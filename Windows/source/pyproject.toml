[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiime2-provenance-gui"
version = "1.2.0"
description = "A read-only desktop explorer for QIIME 2 provenance"
requires-python = ">=3.13"
dependencies = ["PySide6-Essentials==6.8.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "types-PyYAML", "pytest>=8,<10", "pytest-qt>=4,<5", "ruff>=0.11,<1"]

[project.gui-scripts]
qiime2-provenance = "qiime2_provenance.app:main"

[project.scripts]
qiime2-provenance-cli = "qiime2_provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
